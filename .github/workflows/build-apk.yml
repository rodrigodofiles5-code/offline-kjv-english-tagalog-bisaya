name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Deep Clean
        run: rm -rf android node_modules package-lock.json ~/.gradle android/app/build android/build

      - name: Install with worklets - needed for runtime
        run: |
          npm i --legacy-peer-deps
          npm i react-native-worklets@0.4.1 react-native-reanimated@3.17.5 --save --legacy-peer-deps --force
          npx expo install --fix -- --legacy-peer-deps

      - name: Prebuild clean
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX Hermes + Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.10.2-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re
          b = pathlib.Path('android/build.gradle').read_text()
          b = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.0.21'", b)
          b = re.sub(r"kspVersion.*", "kspVersion = '2.0.21-1.0.28'", b)
          b = re.sub(r"com.android.tools.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.7.3", b)
          pathlib.Path('android/build.gradle').write_text(b)

          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          # TAMA na fix - new File() hindi toString()
          t = re.sub(r'new File\(([^)]+)\)\s*\+\s*"/sdks/hermesc/%OS-BIN%/hermesc"', r'new File(\1, "sdks/hermesc/%OS-BIN%/hermesc")', t)
          t = re.sub(r'(\w+)\s*\+\s*"/sdks/hermesc', r'new File(\1, "sdks/hermesc', t)
          if '+ "/sdks' in t:
              t = t.replace('+ "/sdks', ', "sdks')
          p.write_text(t)
          print(t[ t.find("hermesc"): t.find("hermesc")+120 ])
          PY

      - name: Build Debug APK only - proven SUCCESS 18m
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
