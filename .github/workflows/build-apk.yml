name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps

      - run: npm install -g eas-cli

      - name: Init EAS project if needed
        run: |
          if ! grep -q "projectId" app.json; then
            echo "No projectId found, initializing EAS project..."
            eas init --account rodrigodofiles --non-interactive || true
          fi
          cat app.json || cat app.config.js || echo "no app config"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create eas.json if missing
        run: |
          if [ ! -f eas.json ]; then
            echo '{"cli":{"version":">= 5.9.0","appVersionSource":"remote"},"build":{"preview":{"distribution":"internal","android":{"buildType":"apk"}}}}' > eas.json
          fi

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
