name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove old android folder
        run: rm -rf android

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Prebuild fresh android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Fix Gradle 8.10.2 + keystore
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.10.2-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          t=t.replace(".getAbsolutePath()", ".absolutePath")
          t=t.replace("signingConfig signingConfigs.release", "signingConfig signingConfigs.debug")
          p.write_text(t)
          print("Patched OK")
          PY

      - name: Build DEBUG APK locally
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kjv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
