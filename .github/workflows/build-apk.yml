name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove old android folder
        run: rm -rf android

      - name: Install deps + PLUS PLUS FIX - LAHAT NG DATI + BAGO
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --force
          # PLUS PLUS LAHAT NG DATI ANDITO PA RIN:
          # 1. worklets 0.8.0 - gitna, pasok sa expo at reanimated dati
          # 2. screens 4.11.1 - fix sa React.ElementRef
          # 3. safe-area-context
          # BAGO NGAYON - PLUS PLUS 4:
          # 4. reanimated 4.1.0 - fix sa TRACE_TAG_REACT_JAVA_BRIDGE error mo ngayon
          npx expo install --fix --non-interactive || true
          npm install react-native-reanimated@4.1.0 react-native-worklets@0.5.1 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0 --save --legacy-peer-deps --force
          echo "PLUS PLUS FIXED:"
          npm list react-native-reanimated react-native-worklets react-native-screens || true

      - name: Prebuild fresh android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: PLUS PLUS FIX - Gradle 8.13 + keystore + getAbsolutePath - ANDITO PA RIN
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh android/app/debug.keystore
          
          PWD=$(pwd)
          echo "storeFile=$PWD/android/app/debug.keystore" > android/keystore.properties
          echo "storePassword=android" >> android/keystore.properties
          echo "keyAlias=androiddebugkey" >> android/keystore.properties
          echo "keyPassword=android" >> android/keystore.properties
          cat android/keystore.properties
          
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          print("BEFORE:", "getAbsolutePath" in t)
          t = t.replace('.getAbsolutePath()', '')
          safe_signing = """
          signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          t = re.sub(r'signingConfigs\s*\{.*?release.*?\{.*?\}.*?\n\s*\}', safe_signing, t, flags=re.DOTALL)
          t = t.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug')
          p.write_text(t)
          print("AFTER:", "getAbsolutePath" in t)
          PY

      - name: Build DEBUG APK locally
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kjv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
