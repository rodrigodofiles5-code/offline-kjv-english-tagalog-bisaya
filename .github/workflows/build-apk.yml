name: Build APK
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: PATCH Line 14 fix
        run: |
          echo "PATCHING android/app/build.gradle..."
          sed -n '1,20p' android/app/build.gradle
          sed -i "s|def reactNativeDir.*|def reactNativeDir = new File(\"$GITHUB_WORKSPACE/node_modules/react-native\")|" android/app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "PATCHED:"
          sed -n '1,20p' android/app/build.gradle
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bible-APK
          path: android/app/build/outputs/apk/debug/*.apk
