name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: rm -rf android node_modules package-lock.json

      - name: Install Expo 53 + fix
        run: |
          npm i --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps
          npm i expo@~53.0.20 expo-modules-core@2.3.13 @expo/config-plugins@10.0.0 --save --legacy-peer-deps

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX ALL - Gradle 8.13
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re, glob
          # 1. Kotlin 2.1.20 para sa Gradle 8.13
          f = pathlib.Path('android/build.gradle')
          t = f.read_text()
          t = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.1.20'", t)
          if "kspVersion" not in t:
              t = t.replace("kotlinVersion = '2.1.20'", "kotlinVersion = '2.1.20'\n        kspVersion = '2.1.20-1.0.31'")
          else:
              t = re.sub(r"kspVersion.*", "kspVersion = '2.1.20-1.0.31'", t)
          if "2.1.20" not in t:
              t = t.replace('buildscript {', "buildscript {\n    ext { kotlinVersion = '2.1.20'; kspVersion = '2.1.20-1.0.31' }")
          f.write_text(t)

          # 2. Promise.kt - lahat ng file
          for p in glob.glob('**/Promise.kt', recursive=True):
              txt = pathlib.Path(p).read_text()
              nt = txt.replace('override fun reject','fun reject').replace('override fun resolve','fun resolve')
              if nt != txt:
                  pathlib.Path(p).write_text(nt)
                  print(f"FIXED {p}")

          # 3. getAbsolutePath
          app = pathlib.Path('android/app/build.gradle')
          app.write_text(app.read_text().replace('.getAbsolutePath()',''))
          print("FIXED GRADLE 8.13 + PLUGIN OK")
          PY

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
