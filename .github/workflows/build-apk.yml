name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Remove old android
        run: rm -rf android
      - name: Install deps PLUS PLUS
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --force
          npx expo install expo@~54.0.0 expo-modules-core@latest --fix --non-interactive --force
          npm install react-native-reanimated@4.1.0 react-native-worklets@0.5.1 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0 --save --legacy-peer-deps --force
      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: FIX gradle keystore kotlin
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          PWD=$(pwd)
          echo "storeFile=$PWD/android/app/debug.keystore" > android/keystore.properties
          echo "storePassword=android" >> android/keystore.properties
          echo "keyAlias=androiddebugkey" >> android/keystore.properties
          echo "keyPassword=android" >> android/keystore.properties
          python3 << 'PY'
          import pathlib, re
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          t=t.replace('.getAbsolutePath()','')
          safe="""
          signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          t=re.sub(r'signingConfigs\s*\{.*?release.*?\{.*?\}.*?\n\s*\}',safe,t,flags=re.DOTALL)
          t=t.replace('signingConfig signingConfigs.release','signingConfig signingConfigs.debug')
          p.write_text(t)
          b=pathlib.Path('android/build.gradle')
          bt=b.read_text()
          bt=re.sub(r"kotlinVersion\s*=\s*['\"][^'\"]+['\"]","kotlinVersion = '2.1.20'",bt)
          if "kotlinVersion = '2.1.20'" not in bt:
              bt=bt.replace('buildscript {',"buildscript {\n    ext { kotlinVersion = '2.1.20' }")
          bt=re.sub(r"kspVersion\s*=\s*['\"][^'\"]+['\"]","kspVersion = '2.1.20-2.0.1'",bt)
          if "kspVersion" not in bt:
              bt=re.sub(r"(kotlinVersion\s*=\s*'2\.1\.20')",r"\1\n        kspVersion = '2.1.20-2.0.1'",bt)
          b.write_text(bt)
          print("FIXED")
          PY
      - name: Build DEBUG APK locally
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-kjv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
        if: always()
