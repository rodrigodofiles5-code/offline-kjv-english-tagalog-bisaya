name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Deep Clean
        run: |
          rm -rf android node_modules package-lock.json
          rm -rf ~/.gradle/caches ~/.gradle/wrapper

      - name: Install with Expo 53 official versions
        run: |
          npm i --legacy-peer-deps
          npm i expo@~53.0.20 expo-modules-core@2.2.3 @react-native/gradle-plugin@0.77.1 --save --legacy-peer-deps --force

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX to Expo Official Compatible Versions
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # Expo 53 = Gradle 8.8 + AGP 8.6 + Kotlin 1.9.24 - ito ang hindi magka-conflict
          sed -i "s/gradle-.*-bin.zip/gradle-8.8-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re, glob

          # 1. Force Kotlin 1.9.24 sa buong project para tugma sa expo-module-gradle-plugin
          build = pathlib.Path('android/build.gradle').read_text()
          build = re.sub(r"kotlinVersion.*", "kotlinVersion = '1.9.24'", build)
          build = re.sub(r"kspVersion.*", "kspVersion = '1.9.24-1.0.20'", build)
          if "1.9.24" not in build:
              build = build.replace('buildscript {', "buildscript {\n    ext { kotlinVersion = '1.9.24'; kspVersion = '1.9.24-1.0.20' }")
          pathlib.Path('android/build.gradle').write_text(build)

          # 2. Promise.kt fix
          for p in glob.glob('**/Promise.kt', recursive=True):
              txt = pathlib.Path(p).read_text()
              if 'override fun reject' in txt:
                  pathlib.Path(p).write_text(txt.replace('override fun reject','fun reject').replace('override fun resolve','fun resolve'))
                  print(f"FIXED {p}")

          # 3. Alisin .getAbsolutePath() na sumisira sa line 100
          app = pathlib.Path('android/app/build.gradle').read_text().replace('.getAbsolutePath()','')
          pathlib.Path('android/app/build.gradle').write_text(app)

          print("FIXED: Now using Kotlin 1.9.24 + Gradle 8.8")
          PY

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
