name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove old android folder
        run: rm -rf android

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Prebuild fresh android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Fix Gradle and keystore bug
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # Downgrade Gradle 9.3.1 -> 8.8
          sed -i "s/gradle-.*-bin.zip/gradle-8.8-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          # Patch build.gradle line 14 - gawing safe yung getAbsolutePath
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          t=t.replace("getAbsolutePath()", "absolutePath")
          t=t.replace("file(keystoreProperties['storeFile']).absolutePath", "file(keystoreProperties['storeFile'] ?: 'debug.keystore').absolutePath")
          t=t.replace("file(keystoreProperties['keyAlias'])", "'androiddebugkey'")
          t=t.replace("signingConfig signingConfigs.release", "signingConfig signingConfigs.debug")
          # Force release to use debug keystore
          t=t.replace("release {", "release {\n            signingConfig signingConfigs.debug\n            // patched")
          p.write_text(t)
          print("Patched OK")
          PY
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/app/build.gradle | head -n 35

      - name: Build DEBUG APK locally
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kjv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
