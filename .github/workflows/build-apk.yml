name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Deep Clean
        run: rm -rf android node_modules package-lock.json ~/.gradle android/app/build android/build

      - name: Install
        run: |
          npm i --legacy-peer-deps
          npm i react-native-worklets@0.4.1 react-native-reanimated@3.17.5 @react-native-community/cli --save-dev --legacy-peer-deps --force
          npx expo install --fix -- --legacy-peer-deps

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX Gradle 8.13 + Hermes
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re
          b = pathlib.Path('android/build.gradle').read_text()
          b = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.1.20'", b)
          b = re.sub(r"kspVersion.*", "kspVersion = '2.1.20-2.0.1'", b)
          b = re.sub(r"com.android.tools.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.8.2", b)
          pathlib.Path('android/build.gradle').write_text(b)
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          if "File.metaClass.plus" not in t:
              t = "File.metaClass.plus = { String path -> new File(delegate, path) }\n" + t
          p.write_text(t)
          PY

      - name: MANUAL BUNDLE - offline KJV bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx @react-native-community/cli bundle --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
