name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Deep Clean
        run: rm -rf android node_modules package-lock.json ~/.gradle

      - name: Install - Auto Fix SDK 53 versions
        run: |
          npm i --legacy-peer-deps
          npx expo install expo@~53.0.20 --fix -- --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX - Expo 53 official versions
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.10.2-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re
          b = pathlib.Path('android/build.gradle').read_text()
          b = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.0.21'", b)
          b = re.sub(r"kspVersion.*", "kspVersion = '2.0.21-1.0.28'", b)
          b = re.sub(r"com.android.tools.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.7.3", b)
          if "2.0.21" not in b:
              b = b.replace('buildscript {', "buildscript {\n    ext { kotlinVersion = '2.0.21'; kspVersion = '2.0.21-1.0.28' }")
          pathlib.Path('android/build.gradle').write_text(b)
          app = pathlib.Path('android/app/build.gradle').read_text().replace('.getAbsolutePath()','')
          pathlib.Path('android/app/build.gradle').write_text(app)
          print("FIXED 8.10.2 + Kotlin 2.0.21")
          PY

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
