name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove old android folder
        run: rm -rf android

      - name: Install deps + FIX worklets version
        run: |
          npm install --legacy-peer-deps
          # ITO YUNG FIX SA ERROR MO - 0.10.1 is too new, need 0.5.x
          npm install react-native-worklets@0.5.1 --save --legacy-peer-deps
          npm list react-native-worklets

      - name: Prebuild fresh android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Fix Gradle 8.13
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build DEBUG APK locally
        env:
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kjv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
