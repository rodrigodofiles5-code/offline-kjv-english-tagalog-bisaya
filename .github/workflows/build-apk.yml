name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Clean
        run: rm -rf android node_modules package-lock.json

      - name: Install deps (Expo SDK 53 compatible)
        run: |
          npm i --legacy-peer-deps --force
          npm i expo@~53.0.12 expo-modules-core@2.2.3 react-native-reanimated@3.17.1 react-native-worklets@0.4.1 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0 --save --legacy-peer-deps --force

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: FIX Gradle + Kotlin for Expo 53
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # Expo 53 stable = Gradle 8.10.2 + Kotlin 2.0.21
          sed -i "s/gradle-.*-bin.zip/gradle-8.10.2-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re, glob
          # 1. Kotlin 2.0.21 para hindi mawala expo-module-gradle-plugin
          b = pathlib.Path('android/build.gradle').read_text()
          b = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.0.21'", b)
          b = re.sub(r"kspVersion.*", "kspVersion = '2.0.21-1.0.28'", b)
          if "2.0.21" not in b:
              b = b.replace('buildscript {', "buildscript {\n    ext { kotlinVersion = '2.0.21'; kspVersion = '2.0.21-1.0.28' }")
          pathlib.Path('android/build.gradle').write_text(b)

          # 2. Promise.kt fix - lahat ng file hanapin
          for f in glob.glob('**/Promise.kt', recursive=True):
              t = pathlib.Path(f).read_text()
              if 'override fun reject' in t or 'override fun resolve' in t:
                  pathlib.Path(f).write_text(t.replace('override fun reject','fun reject').replace('override fun resolve','fun resolve'))
                  print(f"FIXED {f}")

          # 3. compileSdk fix para sa :expo project
          app = pathlib.Path('android/app/build.gradle')
          app.write_text(app.read_text().replace('.getAbsolutePath()',''))
          print("FIX DONE - Gradle 8.10.2 + Kotlin 2.0.21")
          PY

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
