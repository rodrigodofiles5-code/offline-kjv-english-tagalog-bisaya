name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: rm -rf android node_modules package-lock.json
      - run: npm i --legacy-peer-deps --force
      - run: npm i react-native-reanimated@4.1.0 react-native-worklets@0.5.1 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0 expo-modules-core@2.2.3 --save --legacy-peer-deps --force
      - run: npx expo prebuild --platform android --clean --non-interactive
      - name: FIX KOTLIN 2.1.20 PROMISE.KT
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          sed -i "s/gradle-.*-bin.zip/gradle-8.13-bin.zip/" android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re, glob
          # 1. Kotlin version
          b = pathlib.Path('android/build.gradle').read_text()
          b = re.sub(r"kotlinVersion.*", "kotlinVersion = '2.1.20'", b)
          if "kspVersion" not in b:
              b = b.replace("kotlinVersion = '2.1.20'", "kotlinVersion = '2.1.20'\n        kspVersion = '2.1.20-1.0.31'")
          if "2.1.20" not in b:
              b = b.replace('buildscript {', "buildscript {\n    ext { kotlinVersion = '2.1.20'; kspVersion = '2.1.20-1.0.31' }")
          pathlib.Path('android/build.gradle').write_text(b)

          # 2. PERFECT Promise.kt fix - lahat ng file
          for f in glob.glob('**/Promise.kt', recursive=True):
              txt = pathlib.Path(f).read_text()
              new_txt = txt.replace('override fun reject', 'fun reject')
              new_txt = new_txt.replace('override fun resolve', 'fun resolve')
              if new_txt != txt:
                  pathlib.Path(f).write_text(new_txt)
                  print(f"FIXED {f}")

          # 3. getAbsolutePath
          app = pathlib.Path('android/app/build.gradle')
          app.write_text(app.read_text().replace('.getAbsolutePath()',''))
          print("ALL FIXES DONE")
          PY
      - run: cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: offline-kjv-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
        if: always()
